services:
  - type: web
    name: spices-root
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MERCHANT_UPI_ID
        sync: false
      - key: MERCHANT_NAME
        value: Spice Roots
      - key: MERCHANT_WHATSAPP_NUMBER
        sync: false
      - key: STORE_NAME
        value: Spice Roots
      - key: STORE_EMAIL
        sync: false
      - key: STORE_PHONE
        sync: false
